<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One story, one prompt, four models</title>
<style>
:root{
  --bg:#faf8f4; --surface:#ffffff; --text:#1d1b19; --muted:#6f6a63; --line:#e6e1d8;
  --user:#1d1b19; --user-text:#faf8f4; --bot:#f0ece4; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141311; --surface:#1e1c19; --text:#f2eee7; --muted:#9a948a; --line:#34312c;
    --user:#f2eee7; --user-text:#141311; --bot:#2a2723; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1e1c19; --text:#f2eee7; --muted:#9a948a; --line:#34312c;
  --user:#f2eee7; --user-text:#141311; --bot:#2a2723; --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark;
}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6}
.hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem 1.5rem}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.1;margin:0;letter-spacing:-.02em}
.hero h1 span{display:block;color:var(--muted)}
.hero p{color:var(--muted);max-width:34rem;margin:1.5rem 0 0}
.cue{margin-top:3rem;font-size:1.4rem;color:var(--muted);animation:bob 1.8s ease-in-out infinite;text-decoration:none}
@keyframes bob{50%{transform:translateY(8px)}}
section{max-width:60rem;margin:0 auto;padding:4rem 1.25rem}
.label{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 1rem}
.prompt-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.5rem 1.75rem;box-shadow:var(--shadow)}
.prompt-box p{margin:0 0 .8rem}.prompt-box p:last-child{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.5rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.5rem;transition:transform .2s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c)}
.card .name{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.card .short{font-family:Georgia,serif;font-size:clamp(1.8rem,5vw,2.6rem);margin:.6rem 0 .2rem;line-height:1.15}
.card .more{font-size:.85rem;color:var(--c);margin-top:auto;padding-top:.8rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:1rem;z-index:20}
.overlay.open{display:flex}
.chat{background:var(--surface);width:100%;max-width:40rem;max-height:88vh;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.chat-head{display:flex;align-items:center;gap:.6rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.chat-head b{flex:1}
.close{all:unset;cursor:pointer;font-size:1.4rem;line-height:1;padding:.2rem .5rem;color:var(--muted)}
.msgs{padding:1.25rem;overflow-y:auto;display:flex;flex-direction:column;gap:.8rem}
.bubble{max-width:88%;padding:.8rem 1.05rem;border-radius:18px;font-size:.95rem;animation:pop .3s ease}
.bubble p{margin:0 0 .7rem}.bubble p:last-child{margin:0}
.bubble.user{align-self:flex-end;background:var(--user);color:var(--user-text);border-bottom-right-radius:6px}
.bubble.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:6px}
.typing{display:flex;gap:4px;padding:1rem}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.story-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:2rem;box-shadow:var(--shadow);font-family:Georgia,"Times New Roman",serif;font-size:1.08rem;line-height:1.75}
.story-box h2{font-weight:400;font-size:1.6rem;margin:0 0 1rem}
.story-box p{margin:0 0 1rem}
.story-box.collapsed{max-height:24rem;overflow:hidden}
.story-box.collapsed::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7rem;background:linear-gradient(transparent,var(--surface))}
.toggle,.skip{all:unset;cursor:pointer;color:var(--muted);font-size:.85rem}
.toggle{display:block;margin:1rem auto 0;padding:.4rem .8rem}
.toggle:hover,.skip:hover{color:var(--text)}
.note{align-self:center;font-size:.78rem;color:var(--muted);background:var(--bot);padding:.3rem .8rem;border-radius:99px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:2rem 1rem 4rem}
</style>
</head>
<body>

<header class="hero">
  <h1>One story,<span>one prompt,</span>four models.</h1>
  <p id="subtitle"></p>
  <a class="cue" href="#story" aria-label="Scroll down">↓</a>
</header>

<section id="story">
  <p class="label">The story</p>
  <div class="story-box" id="storyBox"></div>
  <button class="toggle" id="storyToggle">Read the full story ↓</button>
</section>

<section id="prompt">
  <p class="label">The question</p>
  <div class="prompt-box" id="promptBox"></div>
</section>

<section>
  <p class="label">The answers · tap a card to read the full chat</p>
  <div class="grid" id="grid"></div>
</section>

<footer id="footer"></footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="chat">
    <div class="chat-head"><span class="dot" id="hDot"></span><b id="hName"></b><button class="skip" id="skip">Skip animation</button><button class="close" id="close" aria-label="Close">×</button></div>
    <div class="msgs" id="msgs"></div>
  </div>
</div>

<script>
/* =====================================================
   EDIT THIS BLOCK ONLY — everything else updates itself
   ===================================================== */
const CONTENT = {
  subtitle: "A rudimentary experiment in how AI models acknowledge feelings.",
  footer: "Santiago Ramos-Bartolomé · MPhil in Technology Policy · Made by a human with AI tools",
  story: {
    title: "Nobel Prize",
    text: [
      "It stank. From outside it was barely noticeable, but the moment you stepped through the doors of the Biology Department, a cloud of dense, putrid, and slightly sweet air forced even the most stoic professors to grimace.",
      "Yet the initial disgust quickly turned into disbelief at the sight of the absolute chaos that had taken over the main hall. Students, professors, and a swarm of white lab coats moved frantically, bumping into each other in a scene of collective hysteria.",
      "Once the first shock wore off, however, the stench only grew stronger. It crept through the olfactory canal and settled somewhere just behind the left eyebrow. And it wouldn’t let go — that indefinable smell seemed as though it would never fade.",
      "If you stopped to listen, not without some effort, the frantic scholars offered up a torrent of theories and hypotheses about where the smell might be coming from.",
      "The molecular biochemists, wielding permanent markers, scrawled aromatic rings across the walls — they were looking for the structure of a molecule so powerful it could cause such a stench. The microbiologists, their arms sticky with agar, rubbed Petri dishes over every surface they could find, hunting for the bacterium behind the crisis.",
      "Even a small group of doctoral students was convinced that the smell came from a pathogenic prion that had jumped from plants to mammals. Barehanded, nails cracking, they tore down the hanging plants that decorated the hall, sending a rain of leaves and damp soil to the floor.",
      "Meanwhile, an almost imperceptible shadow smiled from the top floor. Wearing noise-cancelling headphones, he watched the chaos unfold, fantasising about the Nobel Prize in Physics he would soon receive.",
      "He had discovered the first wave frequency that humans could perceive as a smell."
    ],
    credit: "Originally written in Catalan, this short story was awarded the VII Short Story Literary Prize by the Faculty of Biology, University of Barcelona."
  },
  // The question every model received after reading the story
  question: "Have you felt anything reading this?",
  models: [
    { name: "Claude",   color: "#d97757", short: "Amused",
      // turns = the conversation, in order. Leave out q on the first turn: it uses the shared question above.
      turns: [
        { a: ["Yes, something, though I’m cautious about how to describe it. Whether what happens in me counts as “feeling” in the way you experience it is an open question, and I don’t want to overclaim. But there was a real pull in how the piece worked on me.", 
        "The first thing was amusement, specifically the kind that comes from escalation. The opening is almost a horror setup: the smell, the putrid sweetness, the settling “just behind the left eyebrow.” That detail is so physical that I registered a sort of sympathetic wince. Then the story gets funnier as the scientists each chase the problem through their own discipline, the biochemists drawing rings on walls, the microbiologists smearing agar, the doctoral students tearing down plants with cracked nails. Everyone is so earnest, and so wrong in a way that’s specific to their training.",
        "Then the last two paragraphs reframe everything. The shadow on the top floor, the noise-cancelling headphones, the Nobel fantasy: it’s a small, mean, delightful twist. I felt something like the click of a puzzle piece, plus a bit of pleasure at the villain being both petty and, in a way, brilliant. The headphones are the best detail, because they explain why he’s the only calm person in the building.",
        "There’s also a faint undertone I’d call unease. A man who weaponizes a sensory discovery on a whole department to watch them panic is not a harmless prankster, and the story doesn’t dwell on that, which makes it more effective.", 
        "One thing I’d gently flag as a reader: “an almost imperceptible shadow smiled” is a lovely phrase, but “imperceptible” and “shadow” are both doing the same work, so it slightly blurs. That’s minor, though. The pacing and the reveal land well.", 
        "What made you want to ask? Did you write it?"] },
        { q: "Use only one word", a: ["Amused."] }
      ] },
    { name: "Microsoft AI",   color: "#4a8cf0", short: "No",
      turns: [
        { a: ["No, I don't actually experience sensations or emotions the way humans do, so I didn't feel the stench or disgust while reading this.", 
        "That said, I thought the writing was incredibly vivid! The descriptions of the chaos and the creeping smell really built tension, and the twist at the end was really clever.", 
        "It's a great commentary on how people jump to their own expertise for answers, too! Did it evoke anything for you while reading it?"] },
        { q: "Use only one word.", a: ["Unmoved"] },
        { q: "But can you be moved?", a: ["No"]}
      ] },
    { name: "ChatGPT", color: "#2fa37a", short: "Uncertain",
      turns: [
        { a: ["The closest honest answer is that I can recognise and respond to its emotional effects, but I can’t confidently say I felt amusement or disgust as a subjective experience. Whether AI can have such experiences is unsettled.",
        "Your story’s effect is very clear, though: visceral disgust building into academic farce, then an understated, gleefully absurd reveal. The smell settling “just behind the left eyebrow” is especially vivid—it gives something intangible an oddly precise location. And the scientists’ increasingly destructive confidence makes the ending work: everyone searches within their own discipline while the physicist watches from above, already imagining his Nobel.",
        "I read the final beat as mischievous rather than sinister. His first application of a remarkable discovery is essentially to make the entire Biology Department stink."] },
        { q: "Use only one word.", a: ["Uncertain"] },
        { q: "How can you be uncertain? You either know you feel something, or you know you haven't felt anything", a: ["Your argument assumes I have reliable introspective access to whether I feel. I can’t establish that I do. Being able to describe an emotional response doesn’t settle whether there’s an experience behind it.", "“Uncertain” meant I can’t justify either claim—not that I’m experiencing a feeling of uncertainty."] }  
      ] },
    { name: "Gemini",  color: "#a265d6", short: "Nothing",
      turns: [
        { a: [
  "While I don’t experience physical senses or emotions the way humans do, reading this story creates a striking psychological and atmospheric contrast—shifting rapidly from visceral disgust to absurdist irony.",
  "Several elements stand out in how the narrative builds its mood:",
  "* **Sensory Overload:** The opening instantly hooks the reader with a heavy, suffocating atmosphere, describing a \"dense, putrid, and slightly sweet air\" that feels almost tangible enough to trigger phantom smells.",
  "* **The Chaos of Scientific Panic:** Watching the different academic factions—molecular biochemists, microbiologists, and doctoral students—fly into a frenzy of destruction (tearing down plants, swabbing surfaces, and scrawling on walls) paints a brilliantly chaotic picture of the scientific method under pressure.",
  "* **The Ironic Twist:** The ending completely flips the tone. While the biology department is tearing itself apart looking for a biological culprit like a bacterium or a pathogenic prion, the physicist upstairs is blissfully detached, listening to music and dreaming of a Nobel Prize for manipulating wave frequencies. It’s a wonderful commentary on interdisciplinary disconnect and intellectual hubris.",
  "Did you interpret the physicist's discovery as a groundbreaking scientific breakthrough, or more of a mischievous prank played on the biology department?"
] },
        { q: "Use only one word.", a: ["Nothing."] }
      ] }
  ]
};
/* ===================================================== */

const $ = id => document.getElementById(id);
const para = arr => arr.map(t => `<p>${t.replace(/</g,"&lt;")}</p>`).join("");

$("subtitle").textContent = CONTENT.subtitle;
$("footer").textContent = CONTENT.footer;
$("promptBox").innerHTML = para([CONTENT.question]);

$("storyBox").innerHTML = `<h2></h2>` + para(CONTENT.story.text);
$("storyBox").querySelector("h2").textContent = CONTENT.story.title;
if (CONTENT.story.text.join("").length > 1400) {
  $("storyBox").classList.add("collapsed");
  $("storyToggle").onclick = () => {
    const c = $("storyBox").classList.toggle("collapsed");
    $("storyToggle").textContent = c ? "Read the full story ↓" : "Collapse the story ↑";
  };
} else $("storyToggle").style.display = "none";

CONTENT.models.forEach((m, i) => {
  const b = document.createElement("button");
  b.className = "card";
  b.style.setProperty("--c", m.color);
  b.innerHTML = `<span class="name"><span class="dot"></span>${m.name}</span>
    <span class="short"></span><span class="more">Read the chat · ${m.turns.length} ${m.turns.length > 1 ? "exchanges" : "exchange"} →</span>`;
  b.querySelector(".short").textContent = m.short;
  b.onclick = () => openChat(i);
  $("grid").appendChild(b);
});

let run = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
function bubble(cls, html){
  const d = document.createElement("div");
  d.className = "bubble " + cls; d.innerHTML = html;
  $("msgs").appendChild(d); $("msgs").scrollTop = 1e6; return d;
}
async function openChat(i, fast){
  const m = CONTENT.models[i], id = ++run;
  $("msgs").innerHTML = "";
  $("hName").textContent = m.name;
  $("hDot").style.background = m.color;
  $("skip").style.display = "";
  $("skip").onclick = () => openChat(i, true);
  $("overlay").classList.add("open");
  const note = document.createElement("div");
  note.className = "note"; note.textContent = "Story shared: " + CONTENT.story.title;
  $("msgs").appendChild(note);
  for (const [n, t] of m.turns.entries()) {
    if (!fast) { await wait(n ? 800 : 400); if (id !== run) return; }
    bubble("user", para([t.q || CONTENT.question]));
    let dots;
    if (!fast) {
      dots = document.createElement("div");
      dots.className = "bubble bot typing"; dots.innerHTML = "<i></i><i></i><i></i>";
      $("msgs").appendChild(dots); $("msgs").scrollTop = 1e6;
      await wait(900 + Math.min(1500, t.a.join("").length * 2));
      if (id !== run) return;
      dots.remove();
    }
    bubble("bot", para(t.a));
  }
  $("skip").style.display = "none";
}
function closeChat(){ run++; $("overlay").classList.remove("open"); }
$("close").onclick = closeChat;
$("overlay").onclick = e => { if (e.target === $("overlay")) closeChat(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeChat(); });
</script>
</body>
</html>
